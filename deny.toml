# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
    all-features = false
    no-default-features = false

[licenses]
    confidence-threshold = 0.8
    allow = [
        "Apache-2.0",
        "Apache-2.0 WITH LLVM-exception",
        "MIT",
        "BSD-2-Clause",
        "BSD-3-Clause",
        "ISC",
        "Unicode-3.0",
        "Zlib",
        "0BSD",
        "Unlicense",
        "BSL-1.0",
        "MPL-2.0",                        # option-ext (via dirs-sys ← shellexpand ← zenoh-util)
        "CDLA-Permissive-2.0",            # permissive data license, no copyleft
    ]

[bans]
    multiple-versions = "warn"
    wildcards = "deny"
    # Workspace crates reference each other by path and are never published.
    allow-wildcard-paths = true

[advisories]
    # Only direct dependencies fail the check for unmaintained crates.
    unmaintained = "workspace"
    ignore = [
        { id = "RUSTSEC-2026-0041", reason = "lz4_flex via zenoh-transport; no fix in zenoh 1.9" },
        { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys via sqlx-sqlite; waiting for an sqlx release with SQLite 3.54+" },
        { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; to be replaced with manual impls" },
        { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only used for macro-time identifier pasting; to be replaced" },
    ]

[sources]
    unknown-registry = "deny"
    unknown-git = "deny"
    allow-registry = [ "https://github.com/rust-lang/crates.io-index" ]
