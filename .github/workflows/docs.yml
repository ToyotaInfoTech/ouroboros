# GitHub Pages deployment workflow for automated documentation
name: Deploy Documentation

on:
  push:
    branches: [develop]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Build Rust documentation
        run: |
          cargo doc --no-deps --workspace
          mkdir -p docs/rust
          cp -r target/doc/* docs/rust/

      - name: Setup Python environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build Python documentation
        run: |
          pip install pdoc
          PYTHONPATH=python \
            pdoc \
            -o docs/python \
            -d google \
            --favicon "https://toyotainfotech.github.io/ouroboros/image/Ouroboros.png" \
            --footer-text "Ouroboros Documentation" \
            --logo "https://toyotainfotech.github.io/ouroboros/image/Ouroboros.png" \
            --search \
            --show-source \
            ouroboros

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
