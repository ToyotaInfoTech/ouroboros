# GitHub Pages deployment workflow for automated documentation
name: Deploy Documentation

on:
  push:
    branches: [develop]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Build Rust documentation
        run: |
          cargo doc --no-deps --workspace
          mkdir -p docs/rust
          cp -r target/doc/* docs/rust/

      - name: Setup Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build Python documentation
        run: |
          pip install pdoc
          PYTHONPATH=python \
            pdoc \
            -o docs/python \
            -d google \
            --favicon "https://toyotainfotech.github.io/ouroboros/image/Ouroboros.png" \
            --footer-text "Ouroboros Documentation" \
            --logo "https://toyotainfotech.github.io/ouroboros/image/Ouroboros.png" \
            --search \
            --show-source \
            ouroboros

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
