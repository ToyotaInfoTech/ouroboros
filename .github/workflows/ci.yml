# CI workflow for testing and linting on pull requests
name: CI

on:
    pull_request:
        branches: [ develop ]
    push:
        branches: [ develop ]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-D warnings"

jobs:
    rust:
        name: Rust (${{ matrix.check }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                check: [ test, clippy, fmt ]
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Rust toolchain
              run: |
                  rustup update stable
                  rustup default stable
                  rustup component add clippy rustfmt

            - name: Run tests
              if: matrix.check == 'test'
              run: |
                  cargo test --workspace

            - name: Run clippy
              if: matrix.check == 'clippy'
              run: |
                  cargo clippy --workspace --all-targets -- -D warnings

            - name: Check formatting
              if: matrix.check == 'fmt'
              run: |
                  cargo fmt --all -- --check

    rust-audit:
        name: Rust dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Install cargo-audit
              run: |
                  cargo install cargo-audit

            - name: Run cargo audit
              run: |
                  # Ignored advisories live in .cargo/audit.toml
                  cargo audit

    python:
        name: Python lint & tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.13"

            - name: Install uv and dependencies
              run: |
                  pip install uv
                  uv sync --locked

            - name: Ruff
              run: uv run --no-sync ruff check python

            - name: Run tests
              run: uv run --no-sync pytest python/tests

    webui:
        name: WebUI lint & typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        defaults:
            run:
                working-directory: webui
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: webui/package-lock.json

            - name: Install dependencies
              run: npm ci

            # Secrets are not exposed to fork PRs.
            - name: Socket security scan
              if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
              run: npx --yes @socketsecurity/cli ci

            - name: Install license-checker-rseidelsohn
              run: npm install --no-save license-checker-rseidelsohn

            - name: Audit dependencies
              run: npm run audit

            - name: TypeScript typecheck
              run: npx tsc -b --noEmit

            - name: ESLint
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

    license-check-python:
        name: License check (Python)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.13"

            - name: Install uv and dependencies
              run: |
                  pip install uv
                  uv sync --locked

            - name: Check Python dependency licenses
              run: |
                  # Deny GPL, AGPL and LGPL family licenses (classifier names and SPDX IDs).
                  FAIL_ON="GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2);GNU Affero General Public License v3 (AGPLv3)"
                  FAIL_ON+=";GNU Lesser General Public License v2 (LGPLv2);GNU Lesser General Public License v2 or later (LGPLv2+)"
                  FAIL_ON+=";GNU Lesser General Public License v3 (LGPLv3);GNU Lesser General Public License v3 or later (LGPLv3+)"
                  FAIL_ON+=";GNU Library or Lesser General Public License (LGPL)"
                  FAIL_ON+=";LGPL-2.0-only;LGPL-2.0-or-later;LGPL-2.1-only;LGPL-2.1-or-later;LGPL-3.0-only;LGPL-3.0-or-later"
                  uv run --no-sync pip-licenses \
                      --format=plain-vertical \
                      --with-license-file \
                      --no-license-path \
                      --fail-on="$FAIL_ON"

    license-check-rust:
        name: Dependency policy (cargo deny)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Rust toolchain
              run: |
                  rustup update stable
                  rustup default stable

            - name: Install cargo-deny
              run: |
                  cargo install cargo-deny --locked

            - name: Check Rust dependencies (advisories, bans, licenses, sources)
              run: |
                  cargo deny check

    license-check-node:
        name: License check (Node.js)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: webui
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: webui/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install license-checker-rseidelsohn
              run: npm install --no-save license-checker-rseidelsohn

            - name: Check Node.js dependency licenses
              run: |
                  npx license-checker-rseidelsohn \
                      --production \
                      --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;BlueOak-1.0.0;0BSD;Unlicense;UNKNOWN" \
                      --excludePrivatePackages \
                      --summary

    spdx-check:
        name: SPDX header check
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Check SPDX headers
              shell: bash
              run: |
                  COPYRIGHT="SPDX-FileCopyrightText: Copyright 2026 TOYOTA MOTOR CORPORATION"
                  LICENSE_ID="SPDX-License-Identifier: Apache-2.0"
                  FAIL=0

                  while IFS= read -r file; do
                      c_copy=$(grep -cF "$COPYRIGHT" "$file" 2>/dev/null || echo 0)
                      c_lic=$(grep -cF "$LICENSE_ID" "$file" 2>/dev/null || echo 0)
                      if [[ "$c_copy" -ne 1 || "$c_lic" -ne 1 ]]; then
                          echo "FAIL [$file]: copyright=$c_copy license=$c_lic"
                          FAIL=1
                      fi
                  done < <(git ls-files \
                      -- '*.rs' '*.ts' '*.tsx' '*.js' '*.py' '*.sh' \
                         '*.yaml' '*.yml' '*.fbs' '*.css' \
                      ':!target/**' \
                      ':!python/ouroboros/gen/**' \
                      ':!docs/**' \
                      ':!.github/skills/**' \
                      ':!.github/instructions/**' \
                      ':!examples/**' \
                      ':!**/Cargo.toml' \
                      ':!Cargo.lock' \
                      ':!uv.lock' \
                      ':!pyproject.toml' \
                      ':!rust-toolchain.toml' \
                      ':!.github/workflows/ci.yml' \
                      ':!crates/ouro_edge/src/gen/**' \
                      ':!experiments/**')

                  if [[ "$FAIL" -ne 0 ]]; then
                      echo ""
                      echo "Each source file must contain exactly one SPDX-FileCopyrightText and one SPDX-License-Identifier header."
                      exit 1
                  fi
                  echo "All source files have valid SPDX headers."

    reuse-lint:
        name: REUSE compliance
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.13"

            - name: Install reuse
              run: pip install "reuse>=5.1,<6"

            - name: Check REUSE compliance
              run: reuse lint

    secret-scan:
        name: Secret scan (gitleaks)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            GITLEAKS_VERSION: "8.30.1"
            GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
            BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install gitleaks
              run: |
                  curl -fsSL -o gitleaks.tar.gz \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
                  tar -xzf gitleaks.tar.gz gitleaks

            - name: Scan the working tree
              run: ./gitleaks detect --source . --no-git --redact --no-banner

            - name: Scan the commits of this change
              run: |
                  # A new branch has an all-zero base; scan only its tip then.
                  if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                      range="-1"
                  else
                      range="${BASE_SHA}..${HEAD_SHA}"
                  fi
                  ./gitleaks detect --source . --redact --no-banner --log-opts="$range"

    notify-slack:
        name: Notify Slack
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        needs: [ rust, rust-audit, python, webui, license-check-python, license-check-rust, license-check-node, spdx-check, reuse-lint, secret-scan ]
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
            WORKFLOW_NAME: ${{ github.workflow }}
            BRANCH_NAME: ${{ github.head_ref }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            PR_URL: ${{ github.event.pull_request.html_url }}
            RUST_RESULT: ${{ needs.rust.result }}
            RUST_AUDIT_RESULT: ${{ needs['rust-audit'].result }}
            PYTHON_RESULT: ${{ needs.python.result }}
            WEBUI_RESULT: ${{ needs.webui.result }}
            SPDX_RESULT: ${{ needs['spdx-check'].result }}
            REUSE_RESULT: ${{ needs['reuse-lint'].result }}
            SECRET_SCAN_RESULT: ${{ needs['secret-scan'].result }}
            LICENSE_PYTHON_RESULT: ${{ needs['license-check-python'].result }}
            LICENSE_RUST_RESULT: ${{ needs['license-check-rust'].result }}
            LICENSE_NODE_RESULT: ${{ needs['license-check-node'].result }}
        steps:
            - name: Send Slack notification
              shell: bash
              run: |
                  if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
                      echo "SLACK_WEBHOOK_URL is not set; skipping Slack notification."
                      exit 0
                  fi

                  overall_result="success"
                  for job_result in "$RUST_RESULT" "$RUST_AUDIT_RESULT" "$PYTHON_RESULT" "$WEBUI_RESULT" "$LICENSE_PYTHON_RESULT" "$LICENSE_RUST_RESULT" "$LICENSE_NODE_RESULT" "$SPDX_RESULT" "$REUSE_RESULT" "$SECRET_SCAN_RESULT"; do
                      if [[ "$job_result" == "failure" || "$job_result" == "cancelled" ]]; then
                          overall_result="failure"
                          break
                      fi
                  done

                  if [[ "$overall_result" == "success" ]]; then
                      status_emoji=":white_check_mark:"
                      status_text="succeeded"
                  else
                      status_emoji=":x:"
                      status_text="failed"
                  fi

                  short_sha="${COMMIT_SHA:0:7}"
                  message="${status_emoji} *${WORKFLOW_NAME}* ${status_text} for PR <${PR_URL}|#${PR_NUMBER}>"
                  message+=$'\n\n'
                  message+="*Branch:* ${BRANCH_NAME}"
                  message+=$'\n'
                  message+="*Commit:* ${short_sha}"
                  message+=$'\n'
                  message+="*Run:* <${RUN_URL}|View workflow run>"
                  message+=$'\n\n'
                  message+="*Jobs:*"
                  message+=$'\n'
                  message+="- Rust: ${RUST_RESULT}"
                  message+=$'\n'
                  message+="- Rust audit: ${RUST_AUDIT_RESULT}"
                  message+=$'\n'
                  message+="- Python: ${PYTHON_RESULT}"
                  message+=$'\n'
                  message+="- WebUI: ${WEBUI_RESULT}"
                  message+=$'\n'
                  message+="- License (Python): ${LICENSE_PYTHON_RESULT}"
                  message+=$'\n'
                  message+="- License (Rust): ${LICENSE_RUST_RESULT}"
                  message+=$'\n'
                  message+="- License (Node.js): ${LICENSE_NODE_RESULT}"
                  message+=$'\n'
                  message+="- SPDX check: ${SPDX_RESULT}"
                  message+=$'\n'
                  message+="- REUSE lint: ${REUSE_RESULT}"
                  message+=$'\n'
                  message+="- Secret scan: ${SECRET_SCAN_RESULT}"

                  escaped_message=${message//\\/\\\\}
                  escaped_message=${escaped_message//"/\\"}
                  escaped_message=${escaped_message//$'\n'/\\n}

                  curl --fail --show-error --silent \
                      -X POST \
                      -H "Content-Type: application/json" \
                      --data "{\"text\":\"${escaped_message}\"}" \
                      "$SLACK_WEBHOOK_URL"
