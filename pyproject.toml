[project]
    name = "ouroboros"
    version = "0.5.0"
    description = "OUROBOROS simulation framework"
    readme = "README.md"
    requires-python = ">=3.13,<3.14"
    license = "Apache-2.0"
    license-files = [ "LICENSE", "NOTICE" ]
    authors = [ { name = "TOYOTA MOTOR CORPORATION" } ]
    keywords = [
        "connected-vehicle",
        "edge-computing",
        "simulation",
        "sumo",
        "telemetry",
    ]
    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Science/Research",
        "Operating System :: MacOS",
        "Operating System :: POSIX :: Linux",
        "Private :: Do Not Upload",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Rust",
        "Topic :: Scientific/Engineering",
    ]
    dependencies = [
        "docopt-ng>=0.9.0",
        "flatbuffers>=25.9.23",
        "numpy>=2.0",
        "opencv-python-headless>=4.10.0",
        "pyyaml>=6.0",
        "ray[default]>=2.60.0",
        "sortedcontainers>=2.4",
        "pyproj>=3.0",
        "sumolib>=1.25.0",
        "traci>=1.25.0",
        "wgpu>=0.19.0",
    ]

    [project.urls]
        Homepage = "https://github.com/ToyotaInfoTech/ouroboros"
        Documentation = "https://toyotainfotech.github.io/ouroboros/"
        Repository = "https://github.com/ToyotaInfoTech/ouroboros"
        Issues = "https://github.com/ToyotaInfoTech/ouroboros/issues"

[tool.setuptools.packages.find]
    where = [ "python" ]
    include = [ "*" ]
    exclude = [ "**/__pycache__/**", "python/ouroboros/gen/**" ]

[tool.pytest.ini_options]
    pythonpath = [ "python" ]
    testpaths = [ "python/tests" ]
    addopts = "-q --disable-warnings --cov=ouroboros --cov-report=term-missing"

[tool.ruff]
    target-version = "py313"
    line-length = 120
    src = [ "python" ]
    exclude = [ "python/ouroboros/gen", "**/gen/**" ]

    [tool.ruff.lint]
        select = [
            "E",   # pycodestyle errors
            "W",   # pycodestyle warnings
            "F",   # pyflakes
            "I",   # isort
            "B",   # flake8-bugbear
            "UP",  # pyupgrade
            "SIM", # flake8-simplify
            "RUF", # ruff-specific rules
        ]
        ignore = [
            "E501",   # line too long (handled by formatter)
            "RUF002", # Japanese and special chars in docstrings are intentional
            "RUF003", # Japanese and special chars in comments are intentional
        ]

        [tool.ruff.lint.isort]
            known-first-party = [ "ouroboros" ]

[tool.mypy]
    python_version = "3.13"
    warn_return_any = true
    warn_unused_configs = true
    disallow_untyped_defs = true
    mypy_path = "python"
    packages = [ "ouroboros" ]

    [[tool.mypy.overrides]]
        module = [ "ray.*", "traci.*", "sumolib.*", "flatbuffers.*" ]
        ignore_missing_imports = true

[dependency-groups]
    dev = [
        "debugpy>=1.8",
        "ipykernel>=7.0",
        "ipython>=9.0",
        "pip-licenses>=5.5.5",
        "py-spy>=0.4",
        "pytest>=9.0",
        "pytest-asyncio>=1.3",
        "pytest-cov>=6.1",
        "ruff>=0.15",
        "zenoh-cli>=0.6.8",
    ]
