services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dashboard_timescaledb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ouroboros}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./etc/db/init:/docker-entrypoint-initdb.d
      - ./etc/postgresql/postgresql.conf:/usr/local/share/postgresql/postgresql.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: dashboard_grafana
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:?Set GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./etc/grafana/provisioning:/etc/grafana/provisioning
      - ./etc/grafana/grafana.ini:/etc/grafana/grafana.ini
    depends_on:
      - timescaledb
