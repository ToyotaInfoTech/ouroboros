# Minimal Grafana configuration for Ouroboros.
# Only settings that differ from Grafana's built-in defaults are listed here.
# Admin credentials are supplied via GF_SECURITY_ADMIN_* environment variables
# (see container/docker-compose.yml).

[security]
# Allow the WebUI to embed Grafana dashboards in an iframe.
allow_embedding = true
