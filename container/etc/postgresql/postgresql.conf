# # # # # # PostgreSQL configuration for TimescaleDB (Ouroboros)
# Optimized for handling high-concurrency telemetry ingestion

# -----------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
# -----------------------------------------------------------------------------

# Increase connection limit for multiple daemon instances and concurrent clients
max_connections = 200

# Connection pooling settings
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# MEMORY SETTINGS
# -----------------------------------------------------------------------------

# Shared memory for caching (25% of system RAM recommended)
# Adjust based on server specs (e.g., 2GB for 8GB RAM, 8GB for 32GB RAM)
shared_buffers = 2GB

# Effective cache size (50-75% of system RAM)
effective_cache_size = 6GB

# Memory for sort/hash operations per connection
work_mem = 16MB

# Memory for maintenance operations (CREATE INDEX, VACUUM)
maintenance_work_mem = 512MB

# -----------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL)
# -----------------------------------------------------------------------------

# WAL settings for better write performance
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Checkpoint settings
checkpoint_completion_target = 0.9

# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------

# Cost estimates
random_page_cost = 1.1  # For SSD storage
effective_io_concurrency = 200  # For SSD storage

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

# Enable connection logging for debugging TCP issues
log_connections = on
log_disconnections = on

# Log line format with client information
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# Log slow queries (adjust threshold as needed)
log_min_duration_statement = 1000  # Log queries taking > 1s

# Log lock waits
log_lock_waits = on
deadlock_timeout = 1s

# -----------------------------------------------------------------------------
# TIMESCALEDB SPECIFIC
# -----------------------------------------------------------------------------

# TimescaleDB extension is loaded via shared_preload_libraries in the Docker image
# Additional tuning can be done via timescaledb.* parameters

# Max background workers for TimescaleDB chunk operations
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# -----------------------------------------------------------------------------
# NETWORK
# -----------------------------------------------------------------------------

# TCP keepalive settings to detect dead connections
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
