[package]
    name = "ouro_core"
    version = { workspace = true }
    edition = "2021"
    rust-version = { workspace = true }
    repository = "https://github.com/ToyotaInfoTech/ouroboros"
    license = { workspace = true }
    publish = { workspace = true }

[lib]
    name = "ouro_core"
    path = "src/lib.rs"

[dependencies]
    ouro_common = { path = "../ouro_common" }
    ouro_state = { path = "../ouro_state" }
    ouro_schema = { path = "../ouro_schema" }
    anyhow = { workspace = true }
    async-trait = { workspace = true }
    serde = { workspace = true }
    serde_json = { workspace = true }
    tokio = { workspace = true }
    tokio-util = { workspace = true }
    toml = { workspace = true }
    futures = { workspace = true }
    flatbuffers = { workspace = true }
    sqlx = { workspace = true }
    zenoh = { workspace = true }
    time = { workspace = true }
    num_cpus = { workspace = true }
    uuid = { workspace = true }
    derivative = { workspace = true }
    ciborium = { workspace = true }
    tracing = { workspace = true }
    tracing-subscriber = { workspace = true }
    tracing-attributes = { workspace = true }
    sysinfo = { workspace = true }
    tempfile = { workspace = true }
    # Optional daemon-only dependencies
    axum = { workspace = true, optional = true }
    crossbeam = { workspace = true, optional = true }
    completion = { workspace = true, optional = true }

[features]
    daemon = [
        "dep:axum",
        "dep:crossbeam",
        "dep:completion",
        "ouro_schema/daemon",
    ]

[dev-dependencies]
    rand = { workspace = true }
