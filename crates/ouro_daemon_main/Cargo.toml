[package]
    name = "ouro_daemon_main"
    version = { workspace = true }
    edition = "2021"
    rust-version = { workspace = true }
    repository = "https://github.com/ToyotaInfoTech/ouroboros"
    license = { workspace = true }
    publish = { workspace = true }

[[bin]]
    name = "ourodaemon"
    path = "src/main.rs"

[dependencies]
    ouro_common = { path = "../ouro_common" }
    ouro_core = { path = "../ouro_core", features = ["daemon"] }
    ouro_daemon = { path = "../ouro_daemon" }
    ouro_schema = { path = "../ouro_schema", features = ["daemon"] }
    ouro_state = { path = "../ouro_state" }
    ouro_webui = { path = "../ouro_webui" }
    clap = { workspace = true }
    anyhow = { workspace = true }
    async-trait = { workspace = true }
    futures = { workspace = true }
    serde = { workspace = true }
    serde_json = { workspace = true }
    serde-value = { workspace = true }
    tokio = { workspace = true }
    tokio-util = { workspace = true }
    tracing = { workspace = true }
    tracing-subscriber = { workspace = true }
    tracing-attributes = { workspace = true }
    strum_macros = { workspace = true }
    sqlx = { workspace = true }
    zenoh = { workspace = true }
    time = { workspace = true }
    axum = { workspace = true }
    tower = { workspace = true }
    tower-http = { workspace = true }
    ciborium = { workspace = true }
    completion = { workspace = true }
    toml = { workspace = true }
    derivative = { workspace = true }
