[package]
    name = "ouro_daemon"
    version = { workspace = true }
    edition = "2021"
    rust-version = { workspace = true }
    repository = "https://github.com/ToyotaInfoTech/ouroboros"
    license = { workspace = true }
    publish = { workspace = true }
    autobins = false

[lib]
    name = "ouro_daemon"
    path = "src/lib.rs"

[dependencies]
    ouro_common = { path = "../ouro_common" }
    ouro_core = { path = "../ouro_core", features = [ "daemon" ] }
    ouro_schema = { path = "../ouro_schema", features = [ "daemon" ] }
    ouro_state = { path = "../ouro_state" }
    clap = { workspace = true }
    async-trait = { workspace = true }
    futures = { workspace = true }
    serde = { workspace = true }
    serde_json = { workspace = true }
    tokio = { workspace = true }
    sqlx = { workspace = true }
    zenoh = { workspace = true }
    time = { workspace = true }
    axum = { workspace = true }
    tower = { workspace = true }
    tower-http = { workspace = true }
    ciborium = { workspace = true }
    toml = { workspace = true }
    derivative = { workspace = true }
    tracing = { workspace = true }
    tracing-attributes = { workspace = true }

[dev-dependencies]
